<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="../CSS/bootstrap.min.css">
  <link rel="stylesheet" href="../CSS/all.min.css">
  <link rel="stylesheet" href="../CSS/style.css">
  <style>
    body {
      background-color: #eee;
    }

    .custom-navbar {
      background-color: #eee;
      padding: 10px 60px;
    }

    .navbar-brand img {
      width: 165px;
      height: 88px;
      object-fit: contain;
      background-color: white;
    }

    .navbar-nav .nav-link {
      color: #555;
      font-size: 17px;
      margin: 0 5px;
      transition: 0.3s;
    }

    .navbar-nav .nav-link.active,
    .navbar-nav .nav-link:hover {
      color: #008aa6;
      font-weight: 600;
    }

    .btn-register {
      border: 1px solid #ddd;
      color: #008aa6;
      background-color: transparent;
      padding: 12px 35px;
      border-radius: 4px;
      font-size: 17px;
      box-shadow: 0 0 3px rgba(0, 0, 0, 0.15);
      transition: 0.3s;
    }

    .btn-register:hover {
      background-color: #008aa6;
      color: white;
    }

    .btn-signin {
      background-color: #008aa6;
      color: white;
      padding: 12px 35px;
      border-radius: 4px;
      font-size: 17px;
      border: none;
      transition: 0.3s;
    }

    .btn-signin:hover {
      background-color: #006f85;
      color: white;
    }

    .lang {
      font-size: 18px;
      color: #111;
      margin-left: 18px;
      cursor: pointer;
    }

    @media (max-width: 991px) {
      .custom-navbar {
        padding: 10px 20px;
      }

      .navbar-brand img {
        width: 140px;
        height: 75px;
      }

      .right-buttons {
        margin-top: 15px;
        align-items: flex-start !important;
      }

      .btn-register,
      .btn-signin {
        width: 100%;
        margin-bottom: 10px;
      }

      .lang {
        margin-left: 0;
      }
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg custom-navbar">
    <div class="container-fluid">

      <!-- Logo -->
      <a class="navbar-brand" href="#">
        <img src="images/logo.png" alt="Job Me Logo">
      </a>

      <!-- Mobile Toggle Button -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Navbar Content -->
      <div class="collapse navbar-collapse" id="mainNavbar">

        <!-- Links -->
        <ul class="navbar-nav me-auto ms-3 mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" href="#">Home Page</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">About us</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Services</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Contact us</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Jobs</a>
          </li>
        </ul>

        <!-- Right Buttons -->
        <div class="right-buttons d-flex align-items-center gap-3">
          <a href="#" class="btn btn-register">Register Company</a>
          <a href="#" class="btn btn-signin">Sign In</a>
          <span class="lang">EN</span>
        </div>

      </div>
    </div>
  </nav>
  <script src="../JS/bootstrap.bundle.js"></script>
  <script src="../JS/main.js"></script>
</body>
</html>
