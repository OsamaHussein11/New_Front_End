<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form</title>
      <style>
      form {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      fieldset {
        width: 300px;
        padding-right: 27.5px;
      }
      input {
        padding: 6px;
        width: 100%;
        margin-top: 5px;
      }
      textarea{
        padding: 7px;
        width: 100%;
      }
      #male, #female, #other {
        margin-right: 5px;
        width: auto;
      }
    </style>
</head>
<body>
  <form action="" method="get">
      <fieldset>
        <legend>User personal information</legend>
        <div>
          <label for="name">Enter your full name: </label><br />
          <input type="text" id="name" name="name_1" placeholder="Your name..." required />
        </div>
        <br/>
        <div>
          <label for="email">Enter your email: </label><br />
          <input type="email" id="email" name="email_1" placeholder="Your email..." required/>
        </div><br />
        <div>
          <label for="password">Enter your password: </label><br />
          <input type="password" id="password" name="password_1" required />
        </div>
        <br />
        <div>
          <label for="confirm_password">Confirm your password: </label><br />
          <input type="password" id="confirm_password" name="confirm_password_1" required/>
        </div>
        <div>
         <p>Enter your Gender:</p>

          <input type="radio" id="male" name="gender" value="male" required>
          <label for="male">Male</label>
        
          <input type="radio" id="female" name="gender" value="female">
          <label for="female">Female</label>
        
          <input type="radio" id="other" name="gender" value="other">
          <label for="other">Other</label>
        </div>
        <br />
        <div>
          <label for="dob">Enter your Date of Birth: </label><br />
          <input type="date" id="dob" name="dob_1" required />
        </div>
        <br />
        <div>
          <label for="address">Enter your Address: </label><br />
          <textarea name="address_1" id="address" placeholder="Your Address..." 
          rows="2"></textarea>
        </div>
        <br />
        <button type="submit">Submit</button>
        <button type="reset" disabled>Reset</button>
      </fieldset>
    </form>
</body>
</html>
